services:
  - type: web
    name: arduino-remote-lighting
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health
    envVars:
      - key: AGENT_TOKEN
        sync: false
      - key: CONTROL_PIN
        sync: false
      - key: SECRET_KEY
        generateValue: true
